<svg viewBox="0 0 600 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif"><style>.t{fill:#20242b}.s{fill:#5c6470}</style><rect width="600" height="640" fill="#fbfaf8"/><text x="300" y="26" class="t" font-weight="700" font-size="15" text-anchor="middle">Each draw = one rising 45° line. Noise just slides it.</text><text x="300" y="44" class="s" font-size="12" text-anchor="middle">Monotone ⇒ exactly one crossing.  45° ⇒ up-down spread = left-right spread.</text><rect x="92" y="54" width="460" height="460" fill="none" stroke="#e3e0da"/><line x1="92" y1="251.1" x2="552" y2="251.1" stroke="#20242b" stroke-width="1.6"/><text x="549" y="246.1" class="t" font-size="11" text-anchor="end">G = 0</text><line x1="354.9" y1="54" x2="354.9" y2="514" stroke="#c9c6c0" stroke-width="1" stroke-dasharray="3 3"/><line x1="92.0" y1="514.0" x2="552.0" y2="54.0" stroke="#5c6470" stroke-width="1.4" stroke-dasharray="6 5"/><text x="499.4" y="122.6" class="s" font-size="10.5">backbone G=t</text><line x1="92.0" y1="310.1" x2="348.1" y2="54.0" stroke="#d9851f" stroke-width="1.7" opacity="0.7"/><line x1="92.0" y1="344.5" x2="382.5" y2="54.0" stroke="#d9851f" stroke-width="1.7" opacity="0.7"/><line x1="92.0" y1="373.4" x2="411.4" y2="54.0" stroke="#d9851f" stroke-width="1.7" opacity="0.7"/><line x1="92.0" y1="405.6" x2="443.6" y2="54.0" stroke="#20242b" stroke-width="2.4" opacity="1"/><line x1="92.0" y1="411.3" x2="449.3" y2="54.0" stroke="#d9851f" stroke-width="1.7" opacity="0.7"/><line x1="92.0" y1="425.6" x2="463.6" y2="54.0" stroke="#d9851f" stroke-width="1.7" opacity="0.7"/><line x1="92.0" y1="460.3" x2="498.3" y2="54.0" stroke="#d9851f" stroke-width="1.7" opacity="0.7"/><circle cx="151.0" cy="251.1" r="3.4" fill="#d84b3f"/><circle cx="185.3" cy="251.1" r="3.4" fill="#d84b3f"/><circle cx="214.2" cy="251.1" r="3.4" fill="#d84b3f"/><circle cx="246.5" cy="251.1" r="4.5" fill="#d84b3f"/><circle cx="252.2" cy="251.1" r="3.4" fill="#d84b3f"/><circle cx="266.4" cy="251.1" r="3.4" fill="#d84b3f"/><circle cx="301.1" cy="251.1" r="3.4" fill="#d84b3f"/><line x1="289.1" y1="54" x2="289.1" y2="514" stroke="#2f6fb0" stroke-width="1" stroke-dasharray="3 3"/><text x="289.1" y="529" fill="#2f6fb0" font-size="10.5" text-anchor="middle">fixed t</text><circle cx="289.1" cy="113.0" r="3" fill="#2f6fb0"/><circle cx="289.1" cy="147.3" r="3" fill="#2f6fb0"/><circle cx="289.1" cy="176.2" r="3" fill="#2f6fb0"/><circle cx="289.1" cy="208.5" r="3" fill="#2f6fb0"/><circle cx="289.1" cy="214.2" r="3" fill="#2f6fb0"/><circle cx="289.1" cy="228.4" r="3" fill="#2f6fb0"/><circle cx="289.1" cy="263.1" r="3" fill="#2f6fb0"/><line x1="273.1428571428571" y1="263.1" x2="273.1428571428571" y2="113.0" stroke="#2f6fb0" stroke-width="2"/><text transform="translate(267.1428571428571,188.1) rotate(-90)" fill="#2f6fb0" font-size="10.5" text-anchor="middle">spread of G(t)</text><line x1="151.0" y1="271.1428571428571" x2="301.1" y2="271.1428571428571" stroke="#d84b3f" stroke-width="2"/><text x="226.1" y="284.1428571428571" fill="#d84b3f" font-size="10.5" text-anchor="middle">spread of crossings = Y_node</text><text x="100" y="70" class="s" font-size="10.5">↕ = ↔  (because 45°)</text><text transform="translate(24,284) rotate(-90)" class="s" font-size="12" text-anchor="middle">energy  G</text><text x="322" y="552" class="s" font-size="12" text-anchor="middle">level  t   (crossings = peel-off Y_node)</text></svg>