// ---------------------------------------------------------------- Class A kernel
// MUST stay in lockstep with shoot() in build_shooting.py. The self-test enforces it.
function shoot(lam){
  const N = REF.N, XMAX = REF.XMAX, h = -(XMAX / (N - 1));
  const u = new Float64Array(N), v = new Float64Array(N);
  u[N-1] = 1.0; v[N-1] = -Math.sqrt(XMAX - lam);
  for (let i = N - 1; i > 0; i--){
    const xi = (i * XMAX) / (N - 1);
    const k1u = v[i],             k1v = (xi - lam) * u[i];
    const k2u = v[i] + h/2*k1v,   k2v = (xi + h/2 - lam) * (u[i] + h/2*k1u);
    const k3u = v[i] + h/2*k2v,   k3v = (xi + h/2 - lam) * (u[i] + h/2*k2u);
    const k4u = v[i] + h*k3v,     k4v = (xi + h   - lam) * (u[i] + h*k3u);
    u[i-1] = u[i] + h/6*(k1u + 2*k2u + 2*k3u + k4u);
    v[i-1] = v[i] + h/6*(k1v + 2*k2v + 2*k3v + k4v);
  }
  return {u, v};
}

(function selfTest(){
  // NB the shot grows to ~1e15 crossing the forbidden region, so this MUST be a relative
  // comparison; an absolute tolerance here is meaningless and reads as a false mismatch.
  const {u, v} = shoot(REF.goldenLam);
  let worst = 0;
  for (const g of REF.golden){
    const su = Math.max(Math.abs(g.u), 1e-300), sv = Math.max(Math.abs(g.v), 1e-300);
    worst = Math.max(worst, Math.abs(u[g.i] - g.u) / su, Math.abs(v[g.i] - g.v) / sv);
  }
  const el = document.getElementById('selftest'), ok = worst < 1e-11;
  el.textContent = (ok ? 'port OK · rel Δ=' : 'PORT MISMATCH · rel Δ=') + worst.toExponential(1);
  el.className = 'tag ' + (ok ? 'pass' : 'fail');
  document.getElementById('note').innerHTML =
    'The miss curve is precomputed in Python (' + REF.lams.length + ' shoots — too many to redo ' +
    'per slider move, and it never changes). The browser does exactly one shoot, for the λ you ' +
    'are holding. The badge checks the two integrators <i>agree</i> at λ=' + REF.goldenLam +
    ', not that either is exact.';
})();

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function resize(){
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;

const M = {l: 52, r: 16, t: 20, b: 30}, GAP = 40;
function L(){
  const W = cv.width / (devicePixelRatio || 1), H = 470;
  const hA = (H - M.t - M.b - GAP) * 0.56, hB = (H - M.t - M.b - GAP) * 0.44;
  return {W, x0: M.l, x1: W - M.r, yA: M.t, hA, yB: M.t + hA + GAP, hB};

function nodesOf(u){
  // Zeros STRICTLY inside (0, XMAX).  At an eigenvalue u(0) = 0 is the boundary condition, and
  // its residual sign is numerical noise -- counting the u[0]->u[1] interval added a phantom
  // node at some eigenvalues and not others.  Start at i = 2.
  let n = 0;
  for (let i = 2; i < u.length; i++) if ((u[i-1] < 0) !== (u[i] < 0)) n++;
  return n;
}

function draw(){
  const l = L(); ctx.clearRect(0, 0, l.W, 470);

               (l.x0 + l.x1) / 2, l.yB + l.hB + 27);
  ctx.save(); ctx.translate(15, l.yB + l.hB / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('miss  u(0)', 0, 0); ctx.restore();

  // ---------- readouts
  document.getElementById('rl').textContent = lam.toFixed(3);
  document.getElementById('rm').textContent = miss.toFixed(4);
  document.getElementById('rn').textContent = nodes;
  let best = null, d = Infinity;
  for (const e of REF.eig) if (Math.abs(e - lam) < d){ d = Math.abs(e - lam); best = e; }
  const rv = document.getElementById('rv');
  if (d < 0.012)
    rv.innerHTML = '<span class="ok"><b>eigenvalue λ' + (REF.eig.indexOf(best) + 1) +
                   ' = ' + best.toFixed(4) + '</b> — and it is the Airy zero |a' +
                   (REF.eig.indexOf(best) + 1) + '|</span>';
  else
    rv.innerHTML = '<span class="muted">nearest eigenvalue ' + best.toFixed(4) +
                   ', ' + d.toFixed(3) + ' away</span>';
}

const el = document.getElementById('lam');
el.addEventListener('input', e => { lam = +e.target.value; sol = shoot(lam); draw(); });
document.getElementById('next').addEventListener('click', () => {
  let nxt = REF.eig.find(e => e > lam + 0.02);
  if (nxt === undefined) nxt = REF.eig[0];
  lam = nxt; el.value = lam; sol = shoot(lam); draw();
});
document.getElementById('reset').addEventListener('click', () => {
  lam = 1.2; el.value = lam; sol = shoot(lam); draw();
});
resize();
</script>
