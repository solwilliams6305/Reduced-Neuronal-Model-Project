<svg viewBox="0 0 720 830" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Noise-induced canard escape across the hazard separatrix</title>
<desc id="dsc">Inner Riccati phase plane: attracting branch R=-sqrt(Y) and unstable separatrix R=+sqrt(Y) form a rightward parabola; the canard rides the stable branch and escapes at the first Airy zero, while noise crosses the separatrix earlier at a random peel-off level. Below, the same threshold as a Kramers barrier of height (4/3)Y^(3/2).</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .pri{fill:#20242b;} .sec{fill:#5c6470;}
  .blue{fill:#2f6fb0;} .red{fill:#d84b3f;} .grn{fill:#1f9d63;} .amb{fill:#d9851f;}
  .ttl{font-weight:700;}
</style>
