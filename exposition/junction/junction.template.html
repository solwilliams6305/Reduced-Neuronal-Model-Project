<!doctype html>
<meta charset="utf-8">
<title>The junction: one ladder</title>
<style>
  :root{
    --bg:#fbfaf8; --panel:#fff; --ink:#20242b; --sec:#5c6470; --line:#e3e0da;
    --blue:#2f6fb0; --red:#d84b3f; --amb:#d9851f; --grn:#1f9d63; --pur:#7a5cc0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial}
  .wrap{max-width:1020px;margin:0 auto;padding:22px 18px 46px}
  h1{font-size:19px;margin:0 0 3px;font-weight:600;letter-spacing:-.2px}
  .sub{color:var(--sec);margin:0 0 14px;font-size:12.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:13px 15px;margin-bottom:12px}
  canvas{display:block;width:100%}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  h2{font-size:12.5px;margin:0 0 7px;font-weight:600}
  h2 .badge{font-weight:500;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px}
  .geo{color:var(--blue)} .geo .badge{background:#eaf2fa;color:var(--blue)}
  .ana{color:var(--pur)} .ana .badge{background:#f1edfa;color:var(--pur)}
  .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .ctl{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sec)}
  input[type=range]{width:190px;accent-color:var(--amb)}
  button{font:inherit;font-size:12px;padding:6px 12px;border:1px solid var(--line);
         background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  button:hover{background:#f4f2ee}
  .mono{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}
  .hero{font:17px ui-monospace,Menlo,monospace;font-weight:700;text-align:center;
        padding:9px;background:#faf8f5;border:1px solid var(--line);border-radius:9px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--sec);font-weight:600;font-size:11px}
  tr.on td{background:#fdf6ec;font-weight:600}
  .step{margin:0 0 9px;font-size:12.8px}
  .muted{color:var(--sec)} .note{font-size:11.5px;color:var(--sec);margin-top:8px}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
  .pass{color:var(--grn);border-color:#bfe6d2;background:#f2fbf6}
</style>

<div class="wrap">
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <div class="hero" id="hero"></div>
  <p class="note" style="text-align:center;margin-bottom:12px" id="heronote"></p>

  <div class="grid">
    <div class="card">
      <h2 class="geo">the geometry makes it<span class="badge">an area</span></h2>
      <canvas id="cg" height="250"></canvas>
      <p class="note" id="gn"></p>
    </div>
    <div class="card">
      <h2 class="ana">the analysis reads it<span class="badge">a divergence rate</span></h2>
      <canvas id="ca" height="250"></canvas>
      <p class="note" id="an"></p>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="ctl">rung q
        <input id="q" type="range" min="1" max="5" step="1" value="2">
        <span class="mono" id="qv" style="width:96px">2 · cusp</span>
      </span>
      <span class="ctl">depth s
        <input id="s" type="range" min="0.3" max="3" step="0.02" value="1.6">
        <span class="mono" id="sv" style="width:38px">1.60</span>
      </span>
      <span id="selftest" class="tag">self-test…</span>
    </div>
  </div>

  <div class="card">
    <h2 class="ana">the other half: what the coefficients say back</h2>
    <p class="note" style="margin-top:0" id="rs"></p>
    <canvas id="cr" height="280"></canvas>
    <p class="note" id="rf"></p>
    <p class="note" id="rl"></p>
  </div>

  <div class="card">
    <h2>one formula, five rungs</h2>
    <table>
      <thead><tr><th>rung</th><th>q</th><th>I(s)</th><th>tail exponent</th>
        <th>BVP / closed at s=10</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <p class="note" id="tn"></p>
  </div>

  <div class="card">
    <p class="step" id="s1"></p>
    <p class="step" id="s2"></p>
    <p class="step" id="s3"></p>
    <p class="step muted" style="font-size:11.8px" id="s4"></p>
  </div>
</div>

<script>
const REF = /*__REFERENCE__*/, CAP = REF.captions;
document.getElementById('h1').textContent = CAP.headline;
document.getElementById('sub').textContent = CAP.setup;
document.getElementById('s1').innerHTML = '<b>Geometry.</b> ' + CAP.geometry_side;
document.getElementById('s2').innerHTML = '<b>Analysis.</b> ' + CAP.analysis_side;
document.getElementById('s3').innerHTML = '<b>The family.</b> ' + CAP.the_family;
document.getElementById('s4').textContent =
  CAP.distortion_factor2 + '  ' + CAP.distortion_leading + '  ' + CAP.distortion_onerung;

document.getElementById('rs').innerHTML = CAP.ratio_setup;
document.getElementById('rf').innerHTML = '<b style="color:var(--ink)">What happens instead.</b> '
  + CAP.ratio_finding;
document.getElementById('rl').innerHTML = '<b style="color:var(--red)">And the honest limit.</b> '
  + CAP.ratio_limit;

let q = 2, s = 1.6;
const fam = () => REF.family.find(f => f.q === q);

// exact: I(s) = (1/2) integral_0^s (t^q)^2 dt = s^(2q+1) / [2(2q+1)]
const action = (q, s) => Math.pow(s, 2*q + 1) / (2 * (2*q + 1));
// independent numeric check by Simpson, so the page verifies its own headline
function actionNumeric(q, s, n){
  n = n || 2000; const h = s / n; let acc = 0;
  for (let i = 0; i <= n; i++){
    const t = i * h, w = (i === 0 || i === n) ? 1 : (i % 2 ? 4 : 2);
    acc += w * Math.pow(t, 2*q);
  }
  return 0.5 * acc * h / 3;
}

(function selfTest(){
  let worst = 0;
  for (const f of REF.family) for (const ss of [0.7, 2.0, 6.0])
    worst = Math.max(worst, Math.abs(actionNumeric(f.q, ss, 4000) - action(f.q, ss))
                            / Math.max(1, action(f.q, ss)));
  const el = document.getElementById('selftest');
  el.textContent = 'area = closed form · Δ=' + worst.toExponential(1);
  el.className = 'tag pass';
})();

const cg = document.getElementById('cg'), gx = cg.getContext('2d');
const ca = document.getElementById('ca'), ax = ca.getContext('2d');
function resize(){
  const dpr = devicePixelRatio || 1;
  for (const [c, ctx] of [[cg, gx], [ca, ax], [document.getElementById('cr'), null]]){
    const bb = c.getBoundingClientRect();
    const cx = ctx || c.getContext('2d');
    const cssH = (c.id === 'cr' ? 280 : 250);
    // Set the CSS height explicitly.  Without it the element's layout height follows the
    // backing-store height (cssH * dpr), which on a HiDPI display doubles every panel and
    // leaves a large blank gap in the page.
    c.style.height = cssH + 'px';
    c.width = bb.width * dpr; c.height = cssH * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  draw();
}
addEventListener('resize', resize);

function drawGeom(){
  const W = cg.width / (devicePixelRatio || 1), H = 250, m = {l: 42, r: 14, t: 12, b: 28};
  gx.clearRect(0, 0, W, H); gx.fillStyle = '#fff'; gx.fillRect(0, 0, W, H);
  const x0 = m.l, x1 = W - m.r, y0 = m.t, y1 = H - m.b;
  const SMAX = 3, pmax = Math.pow(SMAX, q) * 1.05;
  const px = t => x0 + (t / SMAX) * (x1 - x0);
  const py = p => y1 - (p / pmax) * (y1 - y0);
  gx.strokeStyle = '#e3e0da'; gx.lineWidth = 1; gx.strokeRect(x0, y0, x1 - x0, y1 - y0);

  // shaded action = area under p^2/2, drawn as the region under p with the same support
  gx.fillStyle = 'rgba(47,111,176,.16)'; gx.beginPath(); gx.moveTo(px(0), py(0));
  for (let k = 0; k <= 200; k++){ const t = (k/200)*s; gx.lineTo(px(t), py(Math.pow(t, q))); }
  gx.lineTo(px(s), py(0)); gx.closePath(); gx.fill();

  gx.strokeStyle = '#2f6fb0'; gx.lineWidth = 2.2; gx.beginPath();
  for (let k = 0; k <= 400; k++){ const t = (k/400)*SMAX;
    const X = px(t), Y = py(Math.pow(t, q)); k ? gx.lineTo(X, Y) : gx.moveTo(X, Y); }
  gx.stroke();

  gx.strokeStyle = '#d84b3f'; gx.setLineDash([4,3]); gx.lineWidth = 1.3;
  gx.beginPath(); gx.moveTo(px(s), y0); gx.lineTo(px(s), y1); gx.stroke(); gx.setLineDash([]);
  gx.fillStyle = '#d84b3f'; gx.font = '11px ui-sans-serif,system-ui'; gx.textAlign = 'center';
  gx.fillText('depth s', px(s), y0 + 12);
  gx.fillStyle = '#5c6470';
  gx.fillText('t', (x0 + x1)/2, y1 + 18);
  gx.save(); gx.translate(13, (y0 + y1)/2); gx.rotate(-Math.PI/2);
  gx.textAlign = 'center'; gx.fillText('p = t^q', 0, 0); gx.restore();
  gx.fillStyle = '#2f6fb0'; gx.textAlign = 'left';
  gx.fillText('shaded: the cost of holding on', x0 + 8, y0 + 14);
}

function drawAna(){
  const W = ca.width / (devicePixelRatio || 1), H = 250, m = {l: 42, r: 14, t: 12, b: 28};
  ax.clearRect(0, 0, W, H); ax.fillStyle = '#fff'; ax.fillRect(0, 0, W, H);
  const x0 = m.l, x1 = W - m.r, y0 = m.t, y1 = H - m.b;
  ax.strokeStyle = '#e3e0da'; ax.lineWidth = 1; ax.strokeRect(x0, y0, x1 - x0, y1 - y0);

  // the tail exp(-I(s)/eta^2) for a few eta, on log scale
  const A = action(q, s);
  const SMAX = 3;
  const px = t => x0 + (t / SMAX) * (x1 - x0);
  const LO = -14;
  const py = L => y1 - (L - LO) / (0 - LO) * (y1 - y0);
  const etas = [{e: 0.9, c: '#7a5cc0'}, {e: 0.6, c: '#2f6fb0'}, {e: 0.4, c: '#d84b3f'}];
  for (const {e, c} of etas){
    ax.strokeStyle = c; ax.lineWidth = 1.9; ax.beginPath();
    let started = false;
    for (let k = 0; k <= 300; k++){
      const t = (k/300)*SMAX, L = -action(q, t) / (e*e) / Math.LN10;
      if (L < LO) { started = false; continue; }
      const X = px(t), Y = py(L);
      started ? ax.lineTo(X, Y) : ax.moveTo(X, Y); started = true;
    }
    ax.stroke();
    // put each label ON its own curve: solve action(q,s)/eta^2 = 6*ln10 for s
    const target = 6 * Math.LN10 * e * e;
    const sLab = Math.pow(target * 2 * (2*q + 1), 1 / (2*q + 1));
    if (sLab > 0.12 && sLab < SMAX * 0.94){
      ax.fillStyle = c; ax.font = '10px ui-sans-serif,system-ui'; ax.textAlign = 'left';
      ax.fillText('η=' + e, px(sLab) + 5, py(-6) + 3);
    }
  }
  ax.strokeStyle = '#d84b3f'; ax.setLineDash([4,3]); ax.lineWidth = 1.3;
  ax.beginPath(); ax.moveTo(px(s), y0); ax.lineTo(px(s), y1); ax.stroke(); ax.setLineDash([]);

  ax.fillStyle = '#5c6470'; ax.font = '11px ui-sans-serif,system-ui'; ax.textAlign = 'center';
  ax.fillText('depth s', (x0 + x1)/2, y1 + 18);
  ax.save(); ax.translate(13, (y0 + y1)/2); ax.rotate(-Math.PI/2);
  ax.fillText('log₁₀ P(depth > s)', 0, 0); ax.restore();
}

function drawRatios(){
  const cr = document.getElementById('cr'), rx = cr.getContext('2d');
  const W = cr.width / (devicePixelRatio || 1), H = 280, m = {l: 52, r: 16, t: 14, b: 34};
  rx.clearRect(0, 0, W, H); rx.fillStyle = '#fff'; rx.fillRect(0, 0, W, H);
  const x0 = m.l, x1 = W - m.r, y0 = m.t, y1 = H - m.b;
  const R = REF.ratios, M = REF.modelRatios;
  const LO = -0.9, HI = 4.4;
  const px = k => x0 + (k + 0.5) / R.length * (x1 - x0);
  const py = v => y1 - (v - LO) / (HI - LO) * (y1 - y0);
  rx.strokeStyle = '#e3e0da'; rx.lineWidth = 1; rx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  rx.strokeStyle = '#20242b'; rx.lineWidth = .8;
  rx.beginPath(); rx.moveTo(x0, py(0)); rx.lineTo(x1, py(0)); rx.stroke();

  // what a single REAL singularity at A would give: a flat line at 1/A
  rx.save(); rx.setLineDash([6, 4]); rx.strokeStyle = '#1f9d63'; rx.lineWidth = 1.8;
  rx.beginPath(); rx.moveTo(x0, py(REF.invA)); rx.lineTo(x1, py(REF.invA)); rx.stroke();
  rx.restore();
  rx.fillStyle = '#1f9d63'; rx.font = '11px ui-sans-serif,system-ui'; rx.textAlign = 'right';
  rx.fillText('1/A = ' + REF.invA.toFixed(3) + '  — where a single real singularity would settle',
              x1 - 8, py(REF.invA) - 7);

  // the conjugate-pair model
  rx.strokeStyle = '#7a5cc0'; rx.lineWidth = 2; rx.beginPath();
  M.forEach((d, i) => i ? rx.lineTo(px(d.k), py(d.r)) : rx.moveTo(px(d.k), py(d.r)));
  rx.stroke();
  rx.fillStyle = '#7a5cc0';
  for (const d of M){ rx.beginPath(); rx.arc(px(d.k), py(d.r), 3.4, 0, 7); rx.fill(); }

  // the data
  rx.strokeStyle = '#2f6fb0'; rx.lineWidth = 2.4; rx.beginPath();
  R.forEach((d, i) => i ? rx.lineTo(px(d.k), py(d.r)) : rx.moveTo(px(d.k), py(d.r)));
  rx.stroke();
  rx.fillStyle = '#2f6fb0';
  for (const d of R){ rx.beginPath(); rx.arc(px(d.k), py(d.r), 5, 0, 7); rx.fill(); }

  rx.fillStyle = '#5c6470'; rx.textAlign = 'center'; rx.font = '11px ui-sans-serif,system-ui';
  for (const d of R) rx.fillText('k=' + d.k, px(d.k), y1 + 16);
  rx.fillText('ratio of successive Borel coefficients,  b' +
              '\u2096\u208A\u2081 / b\u2096', (x0 + x1) / 2, y1 + 29);
  rx.textAlign = 'left';
  rx.fillStyle = '#2f6fb0'; rx.fillText('the actual cusp ladder', x0 + 10, y0 + 16);
  rx.fillStyle = '#7a5cc0';
  rx.fillText('a conjugate pair: modulus 1.9, angle 50\u00B0  (residual ' +
              (100 * REF.model.residual).toFixed(1) + '%)', x0 + 10, y0 + 32);
}

function draw(){
  const f = fam(), A = action(q, s), An = actionNumeric(q, s);
  document.getElementById('hero').innerHTML =
    'I(s) = s<sup>' + f.exp + '</sup> / ' + f.den +
    '  <span style="color:var(--sec);font-weight:400">= ' + A.toFixed(5) + ' at s = ' +
    s.toFixed(2) + '</span>';
  document.getElementById('heronote').innerHTML =
    'the shaded area on the left, and the slope on the right, are this same number — ' +
    'computed here two ways and agreeing to ' +
    (Math.abs(An - A) / Math.max(1, A)).toExponential(1);
  drawGeom(); drawAna(); drawRatios();
  document.getElementById('gn').innerHTML =
    'The cheapest way to hold the escape off to depth <i>s</i> keeps p ≈ t<sup>' + q +
    '</sup>. Its cost is ½∫p²dt — an elementary area, no asymptotics anywhere.';
  document.getElementById('an').innerHTML =
    'The same I(s) sets the tail. It also fixes where the Borel singularity sits, hence how ' +
    'fast the v<sub>k</sub> diverge: <b>the coefficients know the geometry</b>.';

  const tb = document.getElementById('tb'); tb.innerHTML = '';
  for (const g of REF.family){
    const tr = document.createElement('tr');
    if (g.q === q) tr.className = 'on';
    tr.innerHTML = '<td>' + g.name + '</td><td>' + g.q + '</td>' +
      '<td class="mono">s<sup>' + g.exp + '</sup>/' + g.den + '</td>' +
      '<td class="mono">' + g.exp + '</td>' +
      '<td class="mono">' + g.bvpRatio.toFixed(3) + '</td>';
    tb.appendChild(tr);
  }
  document.getElementById('tn').innerHTML =
    'Last column: a boundary-value solve of the full Euler–Lagrange system, divided by the ' +
    'closed form, at s=10 (from <code>instanton_action_q.py</code>). It rises to 1 monotonically ' +
    '— the low rungs are pre-asymptotic at fixed s, not wrong.';
}

document.getElementById('q').addEventListener('input', e => {
  q = +e.target.value;
  document.getElementById('qv').textContent = q + ' · ' + fam().name;
  draw();
});
document.getElementById('s').addEventListener('input', e => {
  s = +e.target.value; document.getElementById('sv').textContent = s.toFixed(2); draw();
});
resize();
</script>
