<!doctype html>
<meta charset="utf-8">
<title>Shooting: the zeros are the spectrum</title>
<style>
  :root{
    --bg:#fbfaf8; --panel:#fff; --ink:#20242b; --sec:#5c6470; --line:#e3e0da;
    --blue:#2f6fb0; --red:#d84b3f; --amb:#d9851f; --grn:#1f9d63; --pur:#7a5cc0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 18px 46px}
  h1{font-size:19px;margin:0 0 3px;font-weight:600;letter-spacing:-.2px}
  .sub{color:var(--sec);margin:0 0 14px;font-size:12.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:13px 15px;margin-bottom:12px}
  canvas{display:block;width:100%;cursor:crosshair;touch-action:none}
  .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .ctl{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sec)}
  input[type=range]{width:280px;accent-color:var(--amb)}
  button{font:inherit;font-size:12px;padding:6px 12px;border:1px solid var(--line);
         background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  button:hover{background:#f4f2ee}
  button.go{border-color:#c8d8ea;background:#f2f7fc;color:var(--blue);font-weight:600}
  .readout{display:flex;gap:24px;flex-wrap:wrap;
           font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  .big{font-size:15px;font-weight:600}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
  .pass{color:var(--grn);border-color:#bfe6d2;background:#f2fbf6}
  .fail{color:var(--red);border-color:#f2c9c4;background:#fdf3f2}
  .ok{color:var(--grn)} .warn{color:var(--red)}
  .step{margin:0 0 9px;font-size:12.8px}
  .muted{color:var(--sec)}
  .note{font-size:11.5px;color:var(--sec);margin-top:8px}
</style>

<div class="wrap">
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <div class="card">
    <canvas id="cv" height="470"></canvas>
    <div class="readout" style="margin-top:8px">
      <span>λ = <b id="rl">—</b></span>
      <span>miss <b style="color:var(--red)">u(0)</b> = <span id="rm" class="big">—</span></span>
      <span>interior nodes = <b id="rn">—</b></span>
      <span id="rv"></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="ctl">trial energy λ
        <input id="lam" type="range" min="0.05" max="14" step="0.005" value="1.2">
      </span>
      <button class="go" id="next">snap to next eigenvalue</button>
      <button id="reset">reset</button>
      <span id="selftest" class="tag">self-test…</span>
    </div>
    <p class="note" id="note"></p>
  </div>

  <div class="card">
    <p class="step" id="s1"></p>
    <p class="step" id="s2"></p>
    <p class="step" id="s3"></p>
    <p class="step muted" style="font-size:11.8px" id="s4"></p>
  </div>
</div>

<script>
const REF = /*__REFERENCE__*/, CAP = REF.captions;
document.getElementById('h1').textContent = CAP.headline;
document.getElementById('sub').textContent = CAP.setup;
document.getElementById('s1').innerHTML = '<b>1.</b> ' + CAP.the_miss;
document.getElementById('s2').innerHTML = '<b>2. The join.</b> ' + CAP.the_join;
document.getElementById('s3').innerHTML =
  '<b>Why shooting at all?</b> The eigenvalue problem is a boundary-value problem — a condition ' +
  'at each end — and you cannot integrate a boundary condition. So you convert it into an ' +
  'initial-value problem you <i>can</i> integrate, fire from one end, and hunt for the λ that ' +
  'happens to satisfy the other. The miss curve below is that hunt made visible.';
document.getElementById('s4').textContent = CAP.distortion_scale + ' ' + CAP.distortion_halfline;

// ---------------------------------------------------------------- Class A kernel
// MUST stay in lockstep with shoot() in build_shooting.py. The self-test enforces it.
function shoot(lam){
  const N = REF.N, XMAX = REF.XMAX, h = -(XMAX / (N - 1));
  const u = new Float64Array(N), v = new Float64Array(N);
  u[N-1] = 1.0; v[N-1] = -Math.sqrt(XMAX - lam);
  for (let i = N - 1; i > 0; i--){
    const xi = (i * XMAX) / (N - 1);
    const k1u = v[i],             k1v = (xi - lam) * u[i];
    const k2u = v[i] + h/2*k1v,   k2v = (xi + h/2 - lam) * (u[i] + h/2*k1u);
    const k3u = v[i] + h/2*k2v,   k3v = (xi + h/2 - lam) * (u[i] + h/2*k2u);
    const k4u = v[i] + h*k3v,     k4v = (xi + h   - lam) * (u[i] + h*k3u);
    u[i-1] = u[i] + h/6*(k1u + 2*k2u + 2*k3u + k4u);
    v[i-1] = v[i] + h/6*(k1v + 2*k2v + 2*k3v + k4v);
  }
  return {u, v};
}

(function selfTest(){
  // NB the shot grows to ~1e15 crossing the forbidden region, so this MUST be a relative
  // comparison; an absolute tolerance here is meaningless and reads as a false mismatch.
  const {u, v} = shoot(REF.goldenLam);
  let worst = 0;
  for (const g of REF.golden){
    const su = Math.max(Math.abs(g.u), 1e-300), sv = Math.max(Math.abs(g.v), 1e-300);
    worst = Math.max(worst, Math.abs(u[g.i] - g.u) / su, Math.abs(v[g.i] - g.v) / sv);
  }
  const el = document.getElementById('selftest'), ok = worst < 1e-11;
  el.textContent = (ok ? 'port OK · rel Δ=' : 'PORT MISMATCH · rel Δ=') + worst.toExponential(1);
  el.className = 'tag ' + (ok ? 'pass' : 'fail');
  document.getElementById('note').innerHTML =
    'The miss curve is precomputed in Python (' + REF.lams.length + ' shoots — too many to redo ' +
    'per slider move, and it never changes). The browser does exactly one shoot, for the λ you ' +
    'are holding. The badge checks the two integrators <i>agree</i> at λ=' + REF.goldenLam +
    ', not that either is exact.';
})();

let lam = 1.2, sol = shoot(lam);
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function resize(){
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = 470 * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
}
addEventListener('resize', resize);

const M = {l: 52, r: 16, t: 20, b: 30}, GAP = 40;
function L(){
  const W = cv.width / (devicePixelRatio || 1), H = 470;
  const hA = (H - M.t - M.b - GAP) * 0.56, hB = (H - M.t - M.b - GAP) * 0.44;
  return {W, x0: M.l, x1: W - M.r, yA: M.t, hA, yB: M.t + hA + GAP, hB};
}

function nodesOf(u){
  // Zeros STRICTLY inside (0, XMAX).  At an eigenvalue u(0) = 0 is the boundary condition, and
  // its residual sign is numerical noise -- counting the u[0]->u[1] interval added a phantom
  // node at some eigenvalues and not others.  Start at i = 2.
  let n = 0;
  for (let i = 2; i < u.length; i++) if ((u[i-1] < 0) !== (u[i] < 0)) n++;
  return n;
}

function draw(){
  const l = L(); ctx.clearRect(0, 0, l.W, 470);
  const u = sol.u, N = REF.N;
  let amp = 0; for (let i = 0; i < N; i++) amp = Math.max(amp, Math.abs(u[i]));
  const miss = u[0] / amp, nodes = nodesOf(u);

  // ---------- top: the shot
  const pxA = i => l.x0 + (i / (N - 1)) * (l.x1 - l.x0);
  const pyA = w => l.yA + l.hA * (1 - (w / amp + 1) / 2);
  ctx.strokeStyle = '#e3e0da'; ctx.strokeRect(l.x0, l.yA, l.x1 - l.x0, l.hA);
  ctx.strokeStyle = '#20242b'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.moveTo(l.x0, pyA(0)); ctx.lineTo(l.x1, pyA(0)); ctx.stroke();

  ctx.strokeStyle = '#2f6fb0'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i < N; i += 2){ const X = pxA(i), Y = pyA(u[i]); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
  ctx.stroke();

  ctx.fillStyle = '#d84b3f';                 // same rule as nodesOf(): start at i = 2
  for (let i = 2; i < N; i++) if ((u[i-1] < 0) !== (u[i] < 0)){
    ctx.beginPath(); ctx.arc(pxA(i), pyA(0), 4.2, 0, 7); ctx.fill();
  }

  // the wall, and the miss
  ctx.strokeStyle = '#20242b'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(l.x0, l.yA); ctx.lineTo(l.x0, l.yA + l.hA); ctx.stroke();
  ctx.strokeStyle = '#d84b3f'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(l.x0, pyA(0)); ctx.lineTo(l.x0, pyA(u[0])); ctx.stroke();
  ctx.fillStyle = '#d84b3f';
  ctx.beginPath(); ctx.arc(l.x0, pyA(u[0]), 5, 0, 7); ctx.fill();
  ctx.font = '11px ui-sans-serif,system-ui'; ctx.textAlign = 'left';
  ctx.fillText('the miss  u(0)', l.x0 + 9, pyA(u[0]) + (u[0] > 0 ? -8 : 15));
  ctx.fillStyle = '#5c6470'; ctx.textAlign = 'center';
  ctx.fillText('x  (wall at 0, decaying end at ' + REF.XMAX + ')', (l.x0 + l.x1) / 2, l.yA + l.hA + 18);
  ctx.save(); ctx.translate(15, l.yA + l.hA / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('u(x), normalised', 0, 0); ctx.restore();

  // ---------- bottom: the miss curve
  const LM = REF.lams, MS = REF.miss;
  const pxB = v => l.x0 + (v - LM[0]) / (LM[LM.length-1] - LM[0]) * (l.x1 - l.x0);
  const pyB = v => l.yB + l.hB * (1 - (v + 1) / 2);
  ctx.strokeStyle = '#e3e0da'; ctx.lineWidth = 1; ctx.strokeRect(l.x0, l.yB, l.x1 - l.x0, l.hB);
  ctx.strokeStyle = '#20242b'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.moveTo(l.x0, pyB(0)); ctx.lineTo(l.x1, pyB(0)); ctx.stroke();
  ctx.strokeStyle = '#7a5cc0'; ctx.lineWidth = 1.9; ctx.beginPath();
  for (let i = 0; i < LM.length; i++){ const X = pxB(LM[i]), Y = pyB(MS[i]); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
  ctx.stroke();

  for (const e of REF.eig){
    ctx.strokeStyle = 'rgba(31,157,99,.65)'; ctx.setLineDash([4,3]); ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(pxB(e), l.yB); ctx.lineTo(pxB(e), l.yB + l.hB); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#1f9d63';
    ctx.beginPath(); ctx.arc(pxB(e), pyB(0), 4, 0, 7); ctx.fill();
    ctx.font = '10px ui-sans-serif,system-ui'; ctx.textAlign = 'center';
    ctx.fillText(e.toFixed(3), pxB(e), l.yB + l.hB + 14);
  }
  ctx.strokeStyle = '#20242b'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(pxB(lam), l.yB); ctx.lineTo(pxB(lam), l.yB + l.hB); ctx.stroke();
  ctx.fillStyle = '#20242b';
  ctx.beginPath(); ctx.arc(pxB(lam), pyB(miss), 4.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#5c6470'; ctx.font = '11px ui-sans-serif,system-ui'; ctx.textAlign = 'center';
  ctx.fillText('trial energy λ   —   green dots are the Airy zeros |aₙ|',
               (l.x0 + l.x1) / 2, l.yB + l.hB + 27);
  ctx.save(); ctx.translate(15, l.yB + l.hB / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('miss  u(0)', 0, 0); ctx.restore();

  // ---------- readouts
  document.getElementById('rl').textContent = lam.toFixed(3);
  document.getElementById('rm').textContent = miss.toFixed(4);
  document.getElementById('rn').textContent = nodes;
  let best = null, d = Infinity;
  for (const e of REF.eig) if (Math.abs(e - lam) < d){ d = Math.abs(e - lam); best = e; }
  const rv = document.getElementById('rv');
  if (d < 0.012)
    rv.innerHTML = '<span class="ok"><b>eigenvalue λ' + (REF.eig.indexOf(best) + 1) +
                   ' = ' + best.toFixed(4) + '</b> — and it is the Airy zero |a' +
                   (REF.eig.indexOf(best) + 1) + '|</span>';
  else
    rv.innerHTML = '<span class="muted">nearest eigenvalue ' + best.toFixed(4) +
                   ', ' + d.toFixed(3) + ' away</span>';
}

const el = document.getElementById('lam');
el.addEventListener('input', e => { lam = +e.target.value; sol = shoot(lam); draw(); });
document.getElementById('next').addEventListener('click', () => {
  let nxt = REF.eig.find(e => e > lam + 0.02);
  if (nxt === undefined) nxt = REF.eig[0];
  lam = nxt; el.value = lam; sol = shoot(lam); draw();
});
document.getElementById('reset').addEventListener('click', () => {
  lam = 1.2; el.value = lam; sol = shoot(lam); draw();
});
resize();
</script>
