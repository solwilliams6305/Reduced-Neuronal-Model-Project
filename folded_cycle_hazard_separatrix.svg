<text x="395" y="262" class="grn" font-size="11.5" font-weight="600">canard  R = Ai&#8242;(Y)/Ai(Y)</text>
<text x="205" y="135" text-anchor="middle" class="grn" font-size="10">deterministic escape</text>

<text x="360" y="378" text-anchor="middle" class="sec" font-size="11">The canard (green) rides the stable branch, then escapes at a&#8321;. Noise (amber) hops the separatrix earlier, at a random Y_node.</text>

