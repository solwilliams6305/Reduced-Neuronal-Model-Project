<meta charset="utf-8">
<title>Coda — three families, one word</title>
<style>
  :root{--bg:#12141a;--fg:#e8eaf0;--dim:#9aa2b1;--line:#2a2f3a;
        --swept:#4a9eff;--genuine:#c0392b;--rmt:#2e7d32;--warn:#e0a800}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:28px 22px 60px;max-width:1180px;margin:0 auto}
  h1{font-size:24px;margin:0 0 6px;font-weight:600}
  .sub{color:var(--dim);max-width:76ch;margin-bottom:26px}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .card{border:1px solid var(--line);border-radius:9px;padding:14px 15px;background:#171a21;
        display:flex;flex-direction:column;gap:9px}
  .card.swept{border-top:3px solid var(--swept)}
  .card.genuine{border-top:3px solid var(--genuine)}
  .card.rmt{border-top:3px solid var(--rmt)}
  .ttl{font-weight:600;font-size:14px;letter-spacing:.2px}
  .eqn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
       background:#0e1015;border:1px solid var(--line);border-radius:6px;padding:9px 10px;
       color:#cfd6e4;overflow-x:auto;white-space:nowrap}
  .idx{color:var(--dim);font-size:12.5px}
  ul.mem{margin:2px 0 0;padding-left:17px;font-size:13px;color:#c6ccd8}
  ul.mem li{margin:2px 0}
  ul.mem li.here{color:var(--fg);font-weight:600}
  .badge{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.4px;
         padding:3px 8px;border-radius:99px;align-self:flex-start}
  .yes{background:#123a1c;color:#7fdb92;border:1px solid #2e7d32}
  .no{background:#3a1212;color:#ff9d9d;border:1px solid #c0392b}
  .why{font-size:12.5px;color:var(--dim)}
  .note{font-size:13px;color:var(--dim);border-left:2px solid var(--line);
        padding-left:11px;margin:16px 0;max-width:82ch}
  .panel{border:1px solid var(--line);border-radius:9px;background:#171a21;padding:16px;
         margin-top:22px}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  label{font-size:13px;color:var(--dim)}
  input[type=range]{width:230px;accent-color:var(--swept)}
  .val{font-family:ui-monospace,monospace;font-size:13px;color:var(--fg);min-width:2.2em}
  table{border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{padding:5px 12px 5px 0;text-align:left}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num{font-family:ui-monospace,monospace}
  .distort{margin-top:26px;border:1px solid var(--warn);border-radius:9px;
           background:#241f0d;padding:14px 16px}
  .distort h3{margin:0 0 8px;font-size:13px;color:var(--warn);letter-spacing:.5px}
  .distort p{margin:7px 0;font-size:13px;color:#e7dcb8;max-width:88ch}
  .falsify{margin-top:18px;border:1px dashed var(--line);border-radius:9px;padding:13px 15px;
           font-size:13.5px;color:#c6ccd8;max-width:88ch}
  .falsify b{color:var(--fg)}
</style>

<h1 id="hl"></h1>
<div class="sub" id="setup"></div>

<div class="cols" id="cols"></div>

<div class="note" id="thirdcol"></div>

<div class="panel">
  <div class="row">
    <label>rung index</label>
    <input type="range" id="idx" min="1" max="5" step="1" value="3">
    <span class="val" id="idxv">3</span>
    <span class="idx" id="idxname"></span>
  </div>
  <table id="tbl"></table>
  <div class="note" style="margin-bottom:0" id="divergence"></div>
  <canvas id="cv" width="820" height="230" style="width:100%;max-width:820px;margin-top:8px"></canvas>
</div>

<div class="falsify" id="falsify"></div>

<div class="distort">
  <h3>WHERE THIS PICTURE LIES</h3>
  <p id="d1"></p><p id="d2"></p><p id="d3"></p>
</div>

<script>
const REF = /*__REFERENCE__*/, CAP = REF.captions;
hl.textContent = CAP.headline;
setup.textContent = CAP.setup;
thirdcol.textContent = CAP.distortion_thirdcol;
divergence.textContent = CAP.divergence;
falsify.innerHTML = '<b>If the claim were false:</b> ' + CAP.falsify;
d1.textContent = CAP.distortion_slice;
d2.textContent = CAP.distortion_thirdcol;
d3.textContent = CAP.distortion_skew;

// ---- the three family cards ----
cols.innerHTML = REF.families.map(f => `
  <div class="card ${f.key}">
    <div class="ttl">${f.title}</div>
    <div class="eqn">${f.eqn}</div>
    <div class="idx">indexed by ${f.index}</div>
    <ul class="mem">${f.members.map((m,i)=>`<li${i===2&&f.key!=='rmt'?' class="here"':''}>${m}</li>`).join('')}</ul>
    <span class="badge ${f.integrable?'yes':'no'}">${f.integrable?'INTEGRABLE':'PROVABLY NOT INTEGRABLE'}</span>
    <div class="why">${f.why}</div>
    <div class="why" style="color:#8891a3">${CAP[f.key].split('—').slice(1).join('—').trim()}</div>
  </div>`).join('');

// ---- the swept rung table, driven by the slider ----
function draw(){
  const q = +idx.value; idxv.textContent = q;
  const s = REF.swept.find(r=>r.q===q);
  idxname.textContent = '— ' + s.name;
  tbl.innerHTML = `
    <tr><th>swept rung q</th><td class="num">${s.q}</td></tr>
    <tr><th>skeleton</th><td class="num">Bessel of order ${s.besselOrder}</td></tr>
    <tr><th>escape level (first node)</th><td class="num">${s.node.toFixed(6)}</td></tr>
    <tr><th>leading edge-variance v₀</th><td class="num">${s.v0.toFixed(5)}</td></tr>
    <tr><th>instanton action</th><td class="num">I(s) = s<sup>${s.instExp}</sup> / ${s.instDen} η²</td></tr>`;
  plot(q);
}

// ---- the divergence plot: two ODE families, shared first rung, opposite directions ----
function plot(q){
  const c = cv.getContext('2d'), W = cv.width, H = cv.height;
  c.clearRect(0,0,W,H);
  const L=52,R=W-16,T=16,B=H-32;
  const xs=i=>L+(i-1)/2*(R-L), ys=v=>B-(v-0)/1.05*(B-T);
  c.strokeStyle='#2a2f3a'; c.lineWidth=1;
  c.beginPath(); c.moveTo(L,T); c.lineTo(L,B); c.lineTo(R,B); c.stroke();
  c.fillStyle='#9aa2b1'; c.font='11px sans-serif';
  [0,0.25,0.5,0.75,1.0].forEach(v=>{c.fillText(v.toFixed(2),8,ys(v)+4);
    c.strokeStyle='#1e222b'; c.beginPath(); c.moveTo(L,ys(v)); c.lineTo(R,ys(v)); c.stroke();});
  [1,2,3].forEach(i=>c.fillText('rung '+i, xs(i)-18, B+18));
  c.fillText('skewness at β=2', L, T+2);
  const series=[['swept','#4a9eff'],['genuine','#c0392b']];
  series.forEach(([k,col])=>{
    const d=REF.skew[k];
    c.strokeStyle=col; c.lineWidth=2.2; c.beginPath();
    d.forEach((p,i)=>i?c.lineTo(xs(p.i),ys(p.v)):c.moveTo(xs(p.i),ys(p.v))); c.stroke();
    d.forEach(p=>{c.fillStyle=col; c.beginPath();
      c.arc(xs(p.i),ys(p.v), p.i===q?6:4, 0, 7); c.fill();
      if(p.i===q){c.strokeStyle='#fff'; c.lineWidth=1.4; c.stroke();}
      c.fillStyle=col; c.fillText(p.v.toFixed(3), xs(p.i)+8, ys(p.v)-7);});
  });
  c.fillStyle='#4a9eff'; c.fillText('swept  (this course)', R-170, T+16);
  c.fillStyle='#c0392b'; c.fillText('genuine Berry–Upstill', R-170, T+32);
}
idx.addEventListener('input', draw); draw();
</script>
